# 2026-10-22：8G 堆 + 4G metaspace 是「鼠标卡死 + AweSun 崩溃」的元凶 ——
# 本机 15.9G 物理内存，构建时 Gradle(8G) + Kotlin daemon + 多个 Dart VM
# 直接把空闲内存吃到 2.7G、页面文件换页峰值 9.7G，系统卡到鼠标成幻灯片。
# 3G 堆足够编译本项目，留足内存给系统与用户交互。
# 2026-11-07：Metaspace 不能再压到 384m —— Gradle 8.14 + Kotlin + AGP 长构建
# 会在 ~6min 处撑爆元空间，daemon 报 "Could not receive a message from the daemon"
# 且没有 hs_err_pid（不是堆 OOM）。768m 是实测下限；本机空闲 7.5G 时安全。
org\.gradle\.jvmargs=\-Xmx1536m\ \-XX:MaxMetaspaceSize=768m\ \-XX:ReservedCodeCacheSize=192m\ \-XX:\+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 项目在 D:、Pub 缓存在 C: 时 Kotlin 增量编译可能报 different roots，关闭可避免 device_info_plus 等失败
kotlin\.incremental=false
org\.gradle\.workers\.max=1
org\.gradle\.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
