    body {

    .loading {
      display: flex;
      flex-direction: column;

      height: 100vh;

    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading p {

      opacity: 0.7;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <!-- CORS代理：Web端通过公共代理服务转发API请求，绕过浏览器跨域限制 -->
  <script>
    // CORS代理服务列表（多个fallback）
    const CORS_PROXIES = [
      'https://api.allorigins.win/raw?url=',
      'https://corsproxy.io/?',
    ];

    // 全局CORS代理函数，供Dart调用
    // 返回Promise<string>，成功时返回响应文本，失败时返回空字符串
    window.corsFetch = async function(url) {
      for (const proxy of CORS_PROXIES) {
        try {
          const response = await fetch(proxy + encodeURIComponent(url), {
            method: 'GET',
            headers: { 'Accept': 'application/json' },
          });
          if (response.ok) {
            return await response.text();
          }
        } catch (e) {
          console.warn('CORS代理失败:', proxy, e);
        }
      }
      console.error('所有CORS代理均失败:', url);
      return '';
    };
  </script>
