<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="跨端影视播放应用">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="影视播放">
  <meta name="theme-color" content="#2196F3">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>影视播放</title>
  <style>
    body {
      background-color: #121212;
      margin: 0;
      padding: 0;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading p {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.7;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <!-- CORS代理：Web端通过公共代理服务转发API请求，绕过浏览器跨域限制 -->
  <script>
    // CORS代理服务列表（多个fallback）
    const CORS_PROXIES = [
      'https://api.allorigins.win/raw?url=',
      'https://corsproxy.io/?',
    ];

    // 全局CORS代理函数，供Dart调用
    // 返回Promise<string>，成功时返回响应文本，失败时返回空字符串
    window.corsFetch = async function(url) {
      for (const proxy of CORS_PROXIES) {
        try {
          const response = await fetch(proxy + encodeURIComponent(url), {
            method: 'GET',
            headers: { 'Accept': 'application/json' },
          });
          if (response.ok) {
            return await response.text();
          }
        } catch (e) {
          console.warn('CORS代理失败:', proxy, e);
        }
      }
      console.error('所有CORS代理均失败:', url);
      return '';
    };
  </script>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <p>正在加载...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
