  <title>罐子</title>
  <style>
    body {
      background-color: #121212;
      margin: 0;
      padding: 0;
    }
    /* 启动占位层：必须在 Flutter 首帧后移除。
       旧版是普通 static 的 div，会撑开 body 高度把 flutter-view 挤到下方，
       用户看到的就是一片 #121212 深灰底（"灰屏"）。这里改为绝对定位 + 首帧淡出。 */
    .loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 0.25s ease;
    }
    .loading.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading.is-removed {
      display: none;
    }
    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading p {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.7;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <!-- CORS代理：Web端通过公共代理服务转发API请求，绕过浏览器跨域限制 -->
  <script>
    // CORS代理服务列表（多个fallback）
    const CORS_PROXIES = [
      'https://api.allorigins.win/raw?url=',
      'https://corsproxy.io/?',
    ];

    // Flutter 首帧就绪后立即移除启动占位层。
    // 兜底：无论首帧回调是否触发，最多 3 秒后也强制移除，避免永久遮挡。
    window.__removeFlutterSplash = function() {
      var el = document.getElementById('flutter-splash');
      if (!el || el.dataset.removing === '1') return;
      el.dataset.removing = '1';
      el.classList.add('is-hidden');
      setTimeout(function() { el.classList.add('is-removed'); }, 300);
      console.log('[splash] removed');
    };
    // 检测到 flutter-view 出现（引擎已挂载）即尝试移除
    window.__watchFlutterReady = function() {
      if (document.querySelector('flutter-view, flt-glass-pane')) {
        window.__removeFlutterSplash();
        return;
      }
      requestAnimationFrame(window.__watchFlutterReady);
    };

    // 全局CORS代理函数，供Dart调用
    // 返回Promise<string>，成功时返回响应文本，失败时返回空字符串
    window.corsFetch = async function(url) {
      for (const proxy of CORS_PROXIES) {
        try {
          const response = await fetch(proxy + encodeURIComponent(url), {
            method: 'GET',
            headers: { 'Accept': 'application/json' },
          });
          if (response.ok) {
            return await response.text();
          }
        } catch (e) {
          console.warn('CORS代理失败:', proxy, e);
        }
      }
      console.error('所有CORS代理均失败:', url);
      return '';
    };
  </script>

  <script>

    window.__watchFlutterReady();
    setTimeout(window.__removeFlutterSplash, 3000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
