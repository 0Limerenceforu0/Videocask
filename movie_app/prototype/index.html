<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Movie App — UI 原型（B站风格参考）</title>
    <link rel="stylesheet" href="css/prototype.css" />
    <link rel="stylesheet" href="css/bilibili-theme.css" />
  </head>
  <body>
    <main id="app" aria-busy="false"></main>

    <nav class="bottom-nav" aria-label="主导航">
      <a href="#/home" data-nav="home"
        ><span class="nav-ic">⌂</span><span>首页</span></a
      >
      <a href="#/discover" data-nav="discover"
        ><span class="nav-ic">◎</span><span>发现</span></a
      >
      <a href="#/follow" data-nav="follow"
        ><span class="nav-ic">♥</span><span>追剧</span></a
      >
      <a href="#/profile" data-nav="profile"
        ><span class="nav-ic">☺</span><span>我的</span></a
      >
    </nav>

    <div id="player-overlay" class="player-overlay" aria-hidden="true">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 12px 16px;
          color: #fff;
        "
      >
        <button
          type="button"
          class="icon-btn"
          id="player-close"
          style="color: #fff"
          aria-label="关闭播放器"
        >
          ✕
        </button>
        <span
          id="player-episode-title"
          style="font-size: 14px; flex: 1; text-align: center"
          >正在播放</span
        >
        <span style="width: 40px"></span>
      </div>
      <div class="player-video">视频画面占位（静态原型）</div>
      <div class="player-bar">
        <div class="player-controls">
          <button type="button" class="icon-btn" style="color: #fff">▶</button>
          <span style="font-size: 12px; color: #aaa">12:04</span>
          <div class="scrub"><span></span></div>
          <span style="font-size: 12px; color: #aaa">45:20</span>
        </div>
        <div class="player-tools">
          <button type="button">清晰度</button>
          <button type="button">倍速</button>
          <button type="button">字幕</button>
          <button type="button">投屏</button>
          <button type="button">全屏</button>
        </div>
      </div>
    </div>

    <script src="js/mock-data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
